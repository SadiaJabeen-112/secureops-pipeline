trigger:
  branches:
    include:
    - main
    - develop
  paths:
    include:
    - app/*
    - docker/*

pr:
  branches:
    include:
    - main

variables:
- group: secureops-keyvault-secrets
- name: imageRepository
  value: 'secureops-app'
- name: dockerfilePath
  value: 'docker/Dockerfile'
- name: tag
  value: '$(Build.BuildId)'
- name: aciName
  value: 'secureops-container'
- name: resourceGroup
  value: 'secureops-rg'

pool:
  vmImage: 'ubuntu-latest'

stages:

- stage: Build
  displayName: 'Build — Validate and Prepare'
  jobs:
  - job: ValidateBuild
    displayName: 'Validate HTML and Docker files'
    steps:

    - task: CmdLine@2
      displayName: 'Validate HTML file exists'
      inputs:
        script: |
          echo "Checking application files..."
          ls -la app/
          if [ ! -f "app/index.html" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi
          echo "index.html found"

    - task: CmdLine@2
      displayName: 'Validate Dockerfile exists'
      inputs:
        script: |
          if [ ! -f "docker/Dockerfile" ]; then
            echo "ERROR: Dockerfile not found"
            exit 1
          fi
          echo "Dockerfile found"

    - task: CmdLine@2
      displayName: 'Print build info'
      inputs:
        script: |
          echo "Build ID:     $(Build.BuildId)"
          echo "Branch:       $(Build.SourceBranchName)"
          echo "Commit:       $(Build.SourceVersion)"
          echo "Triggered by: $(Build.RequestedFor)"

- stage: DockerBuild
  displayName: 'Docker — Build and Push to ACR'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DockerBuildPush
    displayName: 'Build and push Docker image'
    steps:

    - task: Docker@2
      displayName: 'Login to Azure Container Registry'
      inputs:
        command: login
        containerRegistry: 'secureops-acr-connection'

    - task: Docker@2
      displayName: 'Build Docker image'
      inputs:
        command: build
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: 'secureops-acr-connection'
        tags: |
          $(tag)
          latest
        arguments: '--no-cache'

    - task: Docker@2
      displayName: 'Push image to ACR'
      inputs:
        command: push
        repository: $(imageRepository)
        containerRegistry: 'secureops-acr-connection'
        tags: |
          $(tag)
          latest

- stage: SecurityScan
  displayName: 'Security — Trivy Vulnerability Scan'
  dependsOn: DockerBuild
  condition: succeeded()
  jobs:
  - job: TrivyScan
    displayName: 'Scan Docker image for vulnerabilities'
    steps:

    - task: CmdLine@2
      displayName: 'Install Trivy'
      inputs:
        script: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

    - task: CmdLine@2
      displayName: 'Run Trivy scan'
      inputs:
        script: |
          trivy image \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            --format table \
            $(containerRegistry)/$(imageRepository):$(tag)

    - task: CmdLine@2
      displayName: 'Fail if CRITICAL vulnerabilities found'
      inputs:
        script: |
          trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            --quiet \
            $(containerRegistry)/$(imageRepository):$(tag) && \
            echo "No CRITICAL vulnerabilities found" || \
            (echo "CRITICAL vulnerabilities found — pipeline blocked" && exit 1)

- stage: ApprovalGate
  displayName: 'Approval — Human Review Required'
  dependsOn: SecurityScan
  condition: succeeded()
  jobs:
  - job: WaitForApproval
    displayName: 'Waiting for manual approval'
    pool: server
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@0
      displayName: 'Manual approval required'
      inputs:
        notifyUsers: '$(APPROVER_EMAIL)'
        instructions: |
          Please review before approving production deployment.
          Build ID: $(Build.BuildId)
          Branch: $(Build.SourceBranchName)
          Requested by: $(Build.RequestedFor)
          Approve to deploy to production.
        onTimeout: 'reject'

- stage: Deploy
  displayName: 'Deploy — Azure Container Instance'
  dependsOn: ApprovalGate
  condition: succeeded()
  jobs:
  - deployment: DeployToACI
    displayName: 'Deploy to Azure Container Instance'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:

          - task: AzureCLI@2
            displayName: 'Deploy to Azure Container Instance'
            inputs:
              azureSubscription: 'secureops-azure-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Deploying to Azure Container Instance..."
                az container create \
                  --resource-group $(resourceGroup) \
                  --name $(aciName) \
                  --image $(containerRegistry)/$(imageRepository):$(tag) \
                  --ports 80 \
                  --os-type Linux \
                  --cpu 1 \
                  --memory 1 \
                  --restart-policy Always \
                  --location uksouth
                echo "Container deployed successfully"
                IP=$(az container show \
                  --resource-group $(resourceGroup) \
                  --name $(aciName) \
                  --query ipAddress.ip \
                  --output tsv)
                echo "Application live at: http://$IP"

          - task: CmdLine@2
            displayName: 'Health check'
            inputs:
              script: |
                sleep 15
                echo "Deployment complete"
